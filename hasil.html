<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Verifikasi Sertifikat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Latar belakang gradasi kuning ke merah sesuai permintaan */
            background: linear-gradient(135deg, #e4ee2d 0%, #b93434 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .status-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-success {
            background: #d1fae5;
            color: #10b981;
        }

        /* Tetap hijau untuk indikator sukses */
        .icon-error {
            background: #fee2e2;
            color: #ef4444;
        }

        /* Merah untuk indikator gagal */
        .status-icon svg {
            width: 40px;
            height: 40px;
        }

        h2 {
            color: #1f2937;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .result-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            font-size: 16px;
            color: #374151;
            line-height: 1.6;
            display: none;
        }

        .error-box {
            color: #ef4444;
            font-size: 16px;
            margin-bottom: 25px;
            display: none;
        }

        button {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background: #b93434;
            /* Tombol kembali diubah menjadi merah */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        button:hover {
            background: #991b1b;
            /* Merah gelap saat di-hover */
            box-shadow: 0 5px 15px rgba(185, 52, 52, 0.3);
        }
    </style>
</head>

<body>

    <div class="card">
        <div id="iconContainer" class="status-icon">
            <!-- Ikon awal saat memuat (Loading) -->
            <svg style="color: #b93434;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h2 id="judulStatus">Memeriksa Data...</h2>

        <div id="hasilData" class="result-box"></div>
        <div id="pesanError" class="error-box">Maaf, data tidak ditemukan.</div>

        <button onclick="window.location.href='index.html'">Kembali Pencarian</button>
    </div>

    <script>
        // AMBIL nomor peserta dari memori browser secara tersembunyi
        const nomorPeserta = localStorage.getItem('nomorCari');

        const judulStatus = document.getElementById('judulStatus');
        const hasilData = document.getElementById('hasilData');
        const pesanError = document.getElementById('pesanError');
        const iconContainer = document.getElementById('iconContainer');

        if (!nomorPeserta) {
            tampilkanError("Nomor peserta tidak valid atau sesi telah habis.");
        } else {
            fetch('data.csv')
                .then(response => response.text())
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function (results) {
                            const database = results.data;
                            const dataDitemukan = database.find(baris => baris.NomorPeserta === nomorPeserta);

                            if (dataDitemukan) {
                                tampilkanSukses(dataDitemukan);
                            } else {
                                tampilkanError(`Nomor sertifikat <b>${nomorPeserta}</b> tidak terdaftar dalam sistem kami.`);
                            }
                        }
                    });
                })
                .catch(error => {
                    tampilkanError("Terjadi kesalahan saat memuat file data.csv.");
                });
        }

        function tampilkanSukses(data) {
            iconContainer.className = "status-icon icon-success";
            iconContainer.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>`;
            judulStatus.innerText = "Verifikasi Berhasil";

            // Memberikan jarak dan tidak menebalkan semua kalimat
            hasilData.style.lineHeight = "1.8"; // Memberi jarak antar baris
            hasilData.style.textAlign = "left"; // Merapikan teks agar rata kiri di dalam kotak

            hasilData.innerHTML = `
                <div style="margin-bottom: 10px;">Nama: <b>${data.NamaPeserta}</b></div>
                <div style="margin-bottom: 10px;">Instansi: <b>${data.Instansi}</b></div>
                <div>Telah mengikuti: ${data.Kegiatan}</div>
            `;
            hasilData.style.display = "block";
        }

        function tampilkanError(pesan) {
            iconContainer.className = "status-icon icon-error";
            iconContainer.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            judulStatus.innerText = "Data Tidak Ditemukan";

            pesanError.innerHTML = pesan;
            pesanError.style.display = "block";
        }
    </script>

</body>

</html>
