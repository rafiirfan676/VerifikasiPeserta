<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Verifikasi Sertifikat CERDAS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Latar belakang gradasi kuning ke merah sesuai permintaan */
            background: linear-gradient(135deg, #e4ee2d 0%, #b93434 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            margin: 20px;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            /* Latar belakang ikon menjadi merah sangat muda */
            background: #fee2e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            /* Warna ikon menjadi merah */
            color: #b93434;
        }

        h2 {
            color: #1f2937;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            /* Garis tepi saat diklik menjadi merah */
            border-color: #b93434;
            box-shadow: 0 0 0 4px rgba(185, 52, 52, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            /* Tombol utama merah */
            background: #b93434;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            /* Warna tombol saat disentuh mouse (merah lebih gelap) */
            background: #991b1b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(185, 52, 52, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        
        <h2>Verifikasi Sertifikat</h2>
        <p>Silakan masukkan Nomor Peserta Anda untuk memverifikasi keabsahan data kegiatan CERDAS.</p>
        
        <div class="input-group">
            <input type="text" id="nomorSertifikat" placeholder="Contoh: 4537092602030" autocomplete="off">
            <button onclick="validasiSekarang()">Cek Sertifikat</button>
        </div>
        
        <div id="errorText" class="error-message">Nomor Peserta tidak boleh kosong!</div>
    </div>

<script>
        function validasiSekarang() {
            const nomor = document.getElementById('nomorSertifikat').value.trim();
            const errorText = document.getElementById('errorText');

            if (nomor === "") {
                errorText.style.display = "block";
                const inputField = document.getElementById('nomorSertifikat');
                inputField.style.borderColor = "#ef4444";
                setTimeout(() => { inputField.style.borderColor = "#e5e7eb"; }, 1500);
            } else {
                errorText.style.display = "none";
                
                // SIMPAN nomor peserta ke memori browser secara tersembunyi
                localStorage.setItem('nomorCari', nomor);
                
                // Buka halaman hasil TANPA menampilkan nomor di URL
                window.location.href = "hasil.html";
            }
        }

        document.getElementById("nomorSertifikat").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                validasiSekarang();
            }
        });
    </script>

</body>
</html>
